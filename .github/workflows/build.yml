name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: build
            pack: 7z a ../wailsterm-windows-amd64.zip wailsterm.exe
            file: wailsterm-windows-amd64.zip
          - os: ubuntu-24.04
            task: task linux:create:appimage
            pack: tar czf ../wailsterm-linux-amd64.tar.gz wailsterm && mv wailsterm-x86_64.AppImage ../wailsterm-linux-x86_64.AppImage
            file: wailsterm-linux-amd64.tar.gz
            linux: true
          - os: macos-latest
            task: package
            pack: ditto -c -k --keepParent wailsterm.app ../wailsterm-macos-arm64.zip
            file: wailsterm-macos-arm64.zip
          # release APK signed with the key from the repo secrets (debug key when they are
          # missing, e.g. PRs from forks); the runner image ships the Android SDK and NDK
          - os: ubuntu-24.04
            task: task android:package
            pack: mv wailsterm.apk ../wailsterm-android-arm64.apk
            file: wailsterm-android-arm64.apk
            android: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # the wails3 CLI itself links GTK/WebKit on Linux, the Android job needs them too
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      # one signing key for every build, so a new APK installs over the old one
      - if: matrix.android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - run: wails3 ${{ matrix.task }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev.{0}', github.run_number) }}
      - run: ${{ matrix.pack }}
        working-directory: bin
      # archive: false uploads the file as is (one file per step), so the run page does not zip it again
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.file }}
          archive: false
      - if: matrix.linux
        uses: actions/upload-artifact@v7
        with:
          path: wailsterm-linux-x86_64.AppImage
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes wailsterm-*
        env:
          GH_TOKEN: ${{ github.token }}
