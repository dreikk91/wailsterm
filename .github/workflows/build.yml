name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: build
            pack: 7z a ../wailsterm-windows-amd64.zip wailsterm.exe
            file: wailsterm-windows-amd64.zip
          - os: ubuntu-24.04
            task: task linux:create:appimage
            pack: tar czf ../wailsterm-linux-amd64.tar.gz wailsterm && mv wailsterm-x86_64.AppImage ../wailsterm-linux-x86_64.AppImage
            file: wailsterm-linux-amd64.tar.gz
          - os: macos-latest
            task: package
            pack: ditto -c -k --keepParent wailsterm.app ../wailsterm-macos-arm64.zip
            file: wailsterm-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - run: wails3 ${{ matrix.task }}
      - run: ${{ matrix.pack }}
        working-directory: bin
      # archive: false uploads the file as is (one file per step), so the run page does not zip it again
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.file }}
          archive: false
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: wailsterm-linux-x86_64.AppImage
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes wailsterm-*
        env:
          GH_TOKEN: ${{ github.token }}
